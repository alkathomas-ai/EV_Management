<nav class="sidebar">
  <div class="brand">
    <div class="brand-logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
    <div class="brand-text">
      <strong>EV Operations</strong>
      <small>Fleet Intelligence Platform</small>
    </div>
  </div>

  <a routerLink="/home" routerLinkActive="active" class="nav-item home-item">
    <span class="nav-icon" [innerHTML]="icon('home')"></span>
    <span>Home</span>
  </a>

  <div class="nav-section">
    <span class="section-label">Modules</span>
    <a *ngFor="let m of modules" [routerLink]="m.route" routerLinkActive="active" class="nav-item">
      <span class="nav-icon" [innerHTML]="icon(m.icon)"></span>
      <span>{{ m.label }}</span>
    </a>
  </div>

  <div class="nav-section">
    <span class="section-label">System</span>
    <a *ngFor="let s of system" [routerLink]="s.route" routerLinkActive="active" class="nav-item">
      <span class="nav-icon" [innerHTML]="icon(s.icon)"></span>
      <span>{{ s.label }}</span>
    </a>
  </div>

  <div class="sidebar-footer">
    <span class="status-dot"></span>
    <span class="status-text">Platform Online</span>
    <span class="version">v1.2.0</span>
  </div>
</nav>
